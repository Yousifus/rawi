name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the oldest and newest Python the README supports
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install the one import the tests need
        run: python -m pip install --quiet numpy
      - name: every file compiles
        run: python -m compileall -q rawi.py rawi_app.py rawi_dock.py rawi_menubar.py stats.py launch_voice.py voice_out.py rawi_core tests
      - name: unit tests (no microphone, no GPU, no clipboard)
        run: python -m unittest discover -s tests -v
